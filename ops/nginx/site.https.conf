# mkart.com.br com certificado: o site, servido de /var/www/mkart/atual.
# Emitir: sudo certbot certonly --webroot -w /var/www/mkart/acme \
#           -d mkart.com.br -d www.mkart.com.br \
#           --deploy-hook "systemctl reload nginx"

server {
    listen 80;
    listen [::]:80;
    server_name mkart.com.br www.mkart.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mkart/acme;
    }

    location / {
        return 301 https://mkart.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mkart.com.br;

    ssl_certificate /etc/letsencrypt/live/mkart.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mkart.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mkart.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mkart.com.br;

    ssl_certificate /etc/letsencrypt/live/mkart.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mkart.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/mkart-regras.conf;
}
