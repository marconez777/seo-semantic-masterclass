# api.mkart.com.br com certificado: o backend do site, a stack do Supabase
# em /opt/supabase/mkart (ops/supabase/criar-stack.sh), que só escuta em
# 127.0.0.1:8106.
# Emitir: sudo certbot certonly --webroot -w /var/www/mkart/acme \
#           -d api.mkart.com.br --deploy-hook "systemctl reload nginx"
#
# Só as rotas de API passam. O Studio (o painel, na raiz do gateway) fica fora da
# internet: para usá-lo, túnel SSH até 127.0.0.1:8106.

server {
    listen 80;
    listen [::]:80;
    server_name api.mkart.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mkart/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mkart.com.br;

    ssl_certificate /etc/letsencrypt/live/api.mkart.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mkart.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Fotos anexadas ao pedido de orçamento sobem por aqui; o padrão do Nginx é 1 MB.
    client_max_body_size 200m;

    location ~ ^/(rest|auth|storage|functions|graphql)/v1(/|$) {
        proxy_pass http://127.0.0.1:8106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # O chat do site escuta as mensagens novas por websocket.
    location ~ ^/realtime/v1(/|$) {
        proxy_pass http://127.0.0.1:8106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
