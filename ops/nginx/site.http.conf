# GERADO por scripts/gerar-nginx.mjs. Não edite: mude scripts/site.mjs, rotas.mjs ou
# redirects.mjs e rode `npm run nginx:gerar`.

# Domínio principal ANTES de existir certificado: serve por HTTP, o suficiente para o
# certbot validar. O ops/instalar-nginx.sh troca pela variante https quando o
# certificado existe.

server {
    listen 80;
    listen [::]:80;
    server_name mkart.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mkart/acme;
    }

    set $mkart_robots "";
    include snippets/mkart-regras.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.mkart.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mkart/acme;
    }

    # O canonical de toda página é sem www.
    location / {
        return 301 http://mkart.com.br$request_uri;
    }
}
