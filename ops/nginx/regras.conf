# Regras do site, incluídas pelo server de mkart.com.br.
root /var/www/mkart/atual;
charset utf-8;

gzip on;
gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# Nome com hash: pode ficar no cache para sempre. Arquivo que não existe é 404, não o
# index.html (um .js respondido com HTML quebra a página em silêncio).
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# O site é uma SPA: toda rota que não é arquivo cai no index.html, e o roteador do
# React decide (inclusive a página de "não encontrado").
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
}
